<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Thermostat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="container">
  <div id="container"></div>
</div>

<div id="dots"></div>

<script>
  var rooms = [
    { id: "salon", name: "Salon" },
    { id: "veranda", name: "Véranda" }
  ];

  const modes = {
    off: "Off",
    confort: "Confort",
    eco: "Éco",
    horsgel: "Hors-gel"
  };

  function renderPages() {
    var container = document.getElementById("container");
    var dots = document.getElementById("dots");
    var html = "";
    var htmlDots = "";

    for (var i = 0; i < rooms.length; i++) {
      var room = rooms[i];

      // Dots
      htmlDots += '<span class="dot' + (i === 0 ? " active" : "") + '"></span>';

      // Pages
      html += '<div class="page">';
        html += '<div class="room">' + room.name + '</div>';
        html += '<div class="temp-display">';
          html += '<span class="current" id="' + room.id + '-current">--</span>°C';
          html += '<div class="target"><span class="chevron">»</span> <span id="' + room.id + '-target">--</span>°C';
          html += ' - <span id="' + room.id + '-mode">--</span></div>';
        html += '</div>';

      // nouveaux boutons
        html += '<div class="buttons-grid">';

          // ligne du haut
          html += '<div class="buttons-row">';
          html += '<button onclick="setMode(\'' + room.id + '\', \'horsgel\')">❄️</button>';
          html += '<button onclick="setMode(\'' + room.id + '\', \'confort\')">☀️</button>';
          html += '</div>';

          // ligne du bas
          html += '<div class="buttons-row">';
          html += '<button onclick="setMode(\'' + room.id + '\', \'off\')"><img src="/power_white.png" alt="Off" class="icon-img"></button>';
          html += '<button onclick="setMode(\'' + room.id + '\', \'eco\')">🌙</button>';
          html += '</div>';

        html += '</div>';

      html += '</div>';
    }

    container.innerHTML = html;
    dots.innerHTML = htmlDots;
  }

  renderPages();

  function updateDots() {
    var dots = document.getElementsByClassName("dot");

    for (var i = 0; i < dots.length; i++) {
      dots[i].className = "dot";
    }

    dots[current].className = "dot active";
  }

  var container = document.getElementById("container");

  var current = 0;
  var startX = 0;
  var currentX = 0;
  var isMoving = false;

  var pageWidth = 320; // largeur fixe iPod

  // START
  container.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
    isMoving = true;
  }, false);

  // MOVE (important)
  container.addEventListener("touchmove", function(e) {
    if (!isMoving) return;

    currentX = e.touches[0].clientX;
    var diff = currentX - startX;

    container.style.webkitTransition = "none";
    container.style.webkitTransform =
      "translateX(" + (-current * pageWidth + diff) + "px)";
  }, false);

  // END
  container.addEventListener("touchend", function(e) {
    isMoving = false;

    var diff = currentX - startX;

    if (diff < -50 && current < 2) current++;
    if (diff > 50 && current > 0) current--;

    container.style.webkitTransition = "-webkit-transform 0.3s ease-out";
    container.style.webkitTransform =
      "translateX(-" + (current * pageWidth) + "px)";

    updateDots();
  }, false);

  document.addEventListener("touchmove", function(e) {
    e.preventDefault();
  }, { passive: false });

  function updateDisplay() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/temps", true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            
            // Mise à jour Salon
            document.getElementById('salon-current').innerHTML = data.salon.current;
            document.getElementById('salon-target').innerHTML = data.salon.current; // Affiche la température actuelle dans la section "target" temporairement
            document.getElementById('salon-mode').innerHTML = modes[data.salon.currentMode];
            
            // Mise à jour Véranda
            document.getElementById('veranda-current').innerHTML = data.veranda.current;
            document.getElementById('veranda-target').innerHTML = data.veranda.current; // Affiche la température actuelle dans la section "target" temporairement
            document.getElementById('veranda-mode').innerHTML = modes[data.veranda.currentMode];

            setLoadingMode(false);
        }
    };
    xhr.send();
  }

  function setLoadingMode(loadingState) {
    // console.log("Setting loading mode to", loadingState); // Debug
    
    // On récupère tous les boutons de la page
    var buttons = document.getElementsByTagName("button");
    
    // Boucle for classique (la plus rapide et compatible)
    for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];

        // On vérifie si le bouton est bien à l'intérieur d'une .buttons-row
        // car getElementsByTagName les prend tous.
        if (btn.parentNode && btn.parentNode.className.indexOf("buttons-row") !== -1) {
            btn.disabled = loadingState;
            
            // Sur vieux iOS, changer le style manuellement aide à rafraîchir le rendu
            if (loadingState) {
                btn.style.opacity = "0.5";
            } else {
                btn.style.opacity = "1.0";
            }
        }
    }
}


  function setMode(room, mode) {
    var value;

    setLoadingMode(true);

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/set_mode?room=" + room + "&value=" + mode, true);

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        setTimeout(updateDisplay, 1000);
      }
    };

    xhr.send();
  }

  setInterval(updateDisplay, 30000);
  updateDisplay();
</script>

</body>
</html>
