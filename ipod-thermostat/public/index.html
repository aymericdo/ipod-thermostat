<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Thermostat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="container">
  <div id="container"></div>
</div>

<div id="dots">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>

<script>
  var rooms = [
    { id: "salon", name: "Salon" },
    { id: "veranda", name: "Véranda" }
  ];

  function renderPages() {
    var container = document.getElementById("container");
    var html = "";

    for (var i = 0; i < rooms.length; i++) {
      var room = rooms[i];

      html += '<div class="page">';
        html += '<div class="room">' + room.name + '</div>';
        html += '<div class="temp-display">';
          html += '<span class="current" id="' + room.id + '-current">--</span>°C';
          html += '<div class="target"><span id="' + room.id + '-mode">--</span></div>';
        html += '</div>';

      // nouveaux boutons
        html += '<div class="buttons-grid">';

          // ligne du haut
          html += '<div class="buttons-row">';
          html += '<button onclick="setMode(\'' + room.id + '\', \'horsgel\')">❄️</button>';
          html += '<button onclick="setMode(\'' + room.id + '\', \'confort\')">☀️</button>';
          html += '</div>';

          // ligne du bas
          html += '<div class="buttons-row">';
          html += '<button onclick="setMode(\'' + room.id + '\', \'off\')">🔴</button>';
          html += '<button onclick="setMode(\'' + room.id + '\', \'eco\')">🌙</button>';
          html += '</div>';

        html += '</div>';

      html += '</div>';
    }

    container.innerHTML = html;
  }

  renderPages();

  function updateDots() {
    var dots = document.getElementsByClassName("dot");

    for (var i = 0; i < dots.length; i++) {
      dots[i].className = "dot";
    }

    dots[current].className = "dot active";
  }

  var container = document.getElementById("container");

  var current = 0;
  var startX = 0;
  var currentX = 0;
  var isMoving = false;

  var pageWidth = 320; // largeur fixe iPod

  // START
  container.addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
    isMoving = true;
  }, false);

  // MOVE (important)
  container.addEventListener("touchmove", function(e) {
    if (!isMoving) return;

    currentX = e.touches[0].clientX;
    var diff = currentX - startX;

    container.style.webkitTransition = "none";
    container.style.webkitTransform =
      "translateX(" + (-current * pageWidth + diff) + "px)";
  }, false);

  // END
  container.addEventListener("touchend", function(e) {
    isMoving = false;

    var diff = currentX - startX;

    if (diff < -50 && current < 2) current++;
    if (diff > 50 && current > 0) current--;

    container.style.webkitTransition = "-webkit-transform 0.3s ease-out";
    container.style.webkitTransform =
      "translateX(-" + (current * pageWidth) + "px)";

    updateDots();
  }, false);

  document.addEventListener("touchmove", function(e) {
    e.preventDefault();
  }, { passive: false });

  function updateDisplay() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/temps", true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            
            // Mise à jour Salon
            document.getElementById('salon-current').innerHTML = data.salon.current;
            document.getElementById('salon-mode').innerHTML = data.salon.currentMode;
            
            // Mise à jour Véranda
            document.getElementById('veranda-current').innerHTML = data.veranda.current;
            document.getElementById('veranda-mode').innerHTML = data.veranda.currentMode;
        }
    };
    xhr.send();
  }


  function setMode(room, mode) {
    var value;

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/set_mode?room=" + room + "&value=" + mode, true);

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        setTimeout(updateDisplay, 1000);
      }
    };

    xhr.send();
  }

  setInterval(updateDisplay, 30000);
  updateDisplay();
</script>

</body>
</html>
